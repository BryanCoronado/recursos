# Añadir DENTRO del server { listen 443 ... } de michitech.digital
# (antes de location /)
#
# IMPORTANTE: estos location los resuelve Nginx antes de Next.js, así que el
# login de la app NO los protege. Sin auth_basic, cualquiera con la URL entra
# al escritorio del worker con control de teclado y mouse sobre la sesión de
# Envato. Crea el archivo de contraseñas antes de recargar Nginx:
#
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-vnc admin
#   sudo chown www-data:www-data /etc/nginx/.htpasswd-vnc
#   sudo chmod 640 /etc/nginx/.htpasswd-vnc
#   sudo nginx -t && sudo systemctl reload nginx

# Archivos noVNC + proxy WS bajo /vnc/
location /vnc/ {
    auth_basic "Escritorio del worker";
    auth_basic_user_file /etc/nginx/.htpasswd-vnc;

    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400;
    proxy_buffering off;
}

# noVNC por defecto pide wss://dominio/websockify (sin prefijo /vnc).
# Sin auth aquí el candado de arriba no sirve de nada: se puede conectar un
# cliente VNC directo al WebSocket saltándose la página.
location /websockify {
    auth_basic "Escritorio del worker";
    auth_basic_user_file /etc/nginx/.htpasswd-vnc;

    proxy_pass http://127.0.0.1:6080/websockify;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
    proxy_buffering off;
}
